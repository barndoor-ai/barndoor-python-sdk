# Two channels, ONE file on purpose. PyPI's trusted publisher for `barndoor` is
# bound to this repository AND this workflow's filename, so a prerelease job in
# a separate file would need its own binding. Keeping both here means the
# binding that already works keeps working, untouched.
#
#   push to main   -> prerelease  <version>.dev<UTC-YYYYMMDDHHMM>
#   GitHub Release -> release     <version>
#
# Pushes to main come from bdai-platform's sdk_publish.yml, which regenerates
# the client whenever the OpenAPI spec or the SDK's own sources change there.
# The formal release is unchanged and still manual: tag vX.Y.Z, cut a Release.
#
# PEP 440 forbids the scheme the TypeScript SDK uses. `2.0.0-dev.g1a2b3c4` is
# not a valid Python version, and PyPI rejects local identifiers (`+g1a2b3c4`)
# outright, so the commit sha cannot appear in the version at all. A UTC
# timestamp is a valid `.devN` segment, sorts correctly, and does not reset the
# way a workflow run number does. Traceability lives in the commit message,
# which records the monorepo sha that produced the tree.
name: Release

on:
  push:
    branches:
      - main
  release:
    types: [published]
  # A release event runs the workflow as it existed at the TAG's commit, so a
  # release broken by a workflow bug cannot be fixed by fixing the workflow --
  # the tag would have to move, and a tag that has been public is not ours to
  # move. Dispatch runs from the default branch instead, which is the only way
  # to re-drive a release whose publish never ran. Same filename on purpose:
  # PyPI's trusted publisher is bound to it, so this channel inherits the
  # binding rather than needing its own.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # A push that cannot change the distribution must not burn a version number.
  # Everything outside the package — CI, RELEASE.md, examples, the spec copy —
  # is real content that belongs here but never reaches a `pip install`.
  # Fails open: an unusable base publishes, because a version wasted is
  # cheaper than a fix that silently never shipped. The diff comes from git —
  # the push payload omits its file lists on a large commit, which is how every
  # regeneration since this gate landed reported "unchanged". See the script.
  changed:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      package: ${{ steps.check.outputs.package }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # package-changed.py diffs github.event.before against the head, so
          # the base commit has to be in the clone. The default depth of 1 has
          # neither, and the script would fail open on every push.
          fetch-depth: 0
      - id: check
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: .github/scripts/package-changed.py >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: [changed]
    # `always()` because `changed` is skipped on anything but a push, and a
    # skipped need fails this job's default success() guard too.
    if: >-
      always() &&
      (github.event_name == 'release' ||
       github.event_name == 'workflow_dispatch' ||
       needs.changed.outputs.package == 'true')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.8.22

      - name: Set up Python 3.13
        run: uv python install 3.13

      # The version committed to pyproject.toml is the CLEAN one, so a formal
      # release publishes exactly what is in the tree. The .devN segment is
      # applied here and never committed.
      # Push only: a release and a dispatch both publish pyproject.toml's clean
      # version, which is the whole point of a formal release.
      - name: Stamp a prerelease version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          base="$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          stamped="${base}.dev$(date -u +%Y%m%d%H%M)"
          python3 - "$stamped" <<'EOF'
          import pathlib, re, sys
          p = pathlib.Path("pyproject.toml")
          p.write_text(re.sub(r'^version = ".*"$', f'version = "{sys.argv[1]}"', p.read_text(), count=1, flags=re.M))
          EOF
          echo "publishing $stamped"

      - name: Build distributions
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    # GitHub propagates a skip transitively through `needs`. On a release,
    # `changed` is skipped; `build` survives that with always(), but this job's
    # implicit success() still inspects the whole ancestor chain, sees the
    # skipped `changed`, and skips too -- with no steps and no log to say why.
    # That is why v2.2.0 built a wheel and published nothing. Naming build's
    # result explicitly is the only thing that overrides the propagation.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      # Before the artifact download, not after: checkout cleans the workspace
      # and would take dist/ with it. Only needed for the verify script.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist/

      # Must be a full-length commit SHA: this org rejects branch/tag refs for
      # actions, and the failure surfaces during "Set up job" before any step runs
      # (so `build` goes green while `publish` never starts). That is what blocked
      # the v1.3.0 release. dc37677 is the commit behind pypa's v1.14.2 tag.
      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # A green publish step is not evidence anything was published: PyPI
      # processes uploads asynchronously. The script reads it back from both the
      # release object and the index a resolver actually uses.
      - name: Confirm the index serves it
        run: |
          set -euo pipefail
          version="$(ls dist/*.tar.gz | head -1 | sed -E 's/.*barndoor-(.*)\.tar\.gz/\1/')"
          .github/scripts/verify-published.sh barndoor "$version"
