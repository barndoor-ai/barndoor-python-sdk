[project]
name = "barndoor"
version = "2.1.0"
description = "Official Python SDK for the Barndoor AI platform."
authors = [{ name = "Barndoor AI, Inc." }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["barndoor", "mcp", "ai", "sdk", "openapi"]
requires-python = ">=3.11"
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "python-dateutil >= 2.8.2",
  # httpx2 is the httpx 2.x line under a distinct name. It is the SDK's ONLY
  # http stack: authlib and mcp are both built on it, and the generated client
  # is aliased onto it by templates/httpx/rest.mustache. Pulling httpx 0.x in
  # as well would mean two connection pools and an `except httpx.HTTPError`
  # that silently misses half the SDK.
  "httpx2 >= 2.13",
  "pydantic >= 2.11",
  "typing-extensions >= 4.7.1",
  "authlib >= 1.3.2",
  # >=2: 1.x exposed `streamablehttp_client(url, headers=...)`; 2.x renamed it
  # and moved authentication onto an injected http client.
  "mcp >= 2.2, < 3",
]

[project.urls]
Homepage = "https://barndoor.ai"
Repository = "https://github.com/barndoor-ai/barndoor-python-sdk"

[project.scripts]
barndoor-login = "barndoor.lib.cli:main"

[dependency-groups]
dev = [
  "pytest >= 8.3",
  "pytest-asyncio >= 0.24",
  "pyyaml >= 6.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["barndoor*"]

[tool.setuptools.package-data]
barndoor = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pylint.'MESSAGES CONTROL']
extension-pkg-whitelist = "pydantic"
