[project]
name = "barndoor"
dynamic = ["version"]
description = "Official Python SDK for the Barndoor API."
authors = [{ name = "Barndoor AI, Inc." }]
keywords = ["barndoor", "mcp", "ai", "sdk"]
license = { text = "MIT" }

readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "grpcio>=1.76.0",
    "httpx[http2]>=0.27.2",
    "protobuf>=5.29.5",
    "pydantic>=2.10.6",
    "python-dotenv>=1.2.2",
    "PyJWT[crypto]>=2.9.0",
    "typing-extensions>=4.12.2",
]

[project.scripts]
barndoor-login = "barndoor.sdk.cli_login:main"

[project.optional-dependencies]
examples = [
    "crewai>=0.30.0",
    "crewai_tools>=0.1.0",
    "langchain-openai",
    "langchain-mcp-adapters",
    "langgraph>=0.5.3",
    "llama-index",
    "llama-index-tools-mcp",
    "openai>=1.61.1",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-env>=1.1.3",
    "ruff>=0.6.8",
    "pre-commit>=3.8.0",
    "crewai>=0.30.0",
    "crewai_tools>=0.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "barndoor/proto", # Proto schema build from codegen should not be linted
    "examples",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"barndoor/sdk/quickstart.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["barndoor"]
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
line-ending = "lf"

[tool.uv]
constraint-dependencies = [
    "urllib3>=2.7.0",
    "python-multipart>=0.0.27",
    "banks>2.4.1",
    "langchain-core>1.3.2",
    "langsmith>=0.8.0",
    # CVE-2026-25087: arbitrary code execution via malicious IPC payloads in
    # pyarrow, affecting >=15.0.0,<23.0.1. Fixed in 23.0.1. See SECURITY.md.
    "pyarrow>=23.0.1",
    # CVE-2026-22701: filelock path traversal / symlink attack, affecting
    # <3.20.3. Fixed in 3.20.3. filelock reaches this project transitively via
    # huggingface-hub and virtualenv (examples/dev only). See SECURITY.md.
    "filelock>=3.20.3",
    # CVE-2026-45829 ("ChromaToast", CVSS 10.0): pre-auth RCE in chromadb's
    # FastAPI server, affecting >=1.0.0,<=1.5.9. No patched release exists yet
    # (latest published is 1.5.9). chromadb reaches this project only
    # transitively via crewai (examples/dev only) and the vulnerable FastAPI
    # server is never run here, so it is not exploitable. Enable the constraint
    # below once a fixed chromadb (>1.5.9) ships. See SECURITY.md.
    # "chromadb>1.5.9",
    # GHSA-xf7x-x43h-rpqh: circular $ref unbounded CPU DoS in json-repair,
    # affecting <0.60.1. Fixed in 0.60.1. json-repair reaches this project
    # transitively via crewai (examples/dev only). See SECURITY.md.
    "json-repair>=0.60.1",
    # CVE-2026-52870: MCP experimental tasks feature lacks session ownership
    # check (CVSS 7.6), affecting <1.27.2.
    # CVE-2026-52869: MCP SSE/Streamable HTTP session hijack via ID-only
    # lookup (CVSS 7.1), affecting <1.27.2.
    # CVE-2026-59950: MCP deprecated WebSocket transport lacks Host/Origin
    # validation, affecting <1.28.1.
    # Fixed in 1.28.1. mcp reaches this project transitively via crewai,
    # langchain-mcp-adapters, and llama-index-tools-mcp (examples/dev only).
    # See SECURITY.md.
    "mcp>=1.28.1",
    # CVE-2026-69247: Bleichenbacher oracle in pyca/cryptography PKCS#7
    # decryption — pkcs7_decrypt_{der,pem,smime} leak RSA padding outcome via
    # distinguishable error paths and timing, affecting >=44.0.0,<50.0.0.
    # Fixed in 50.0.0. cryptography reaches this project via PyJWT[crypto].
    # See SECURITY.md.
    "cryptography>=50.0.0",
    # CVE-2026-69244: out-of-bounds heap read in aiohttp's C HTTP response
    # parser error path (malformed chunked response), affecting <3.14.3.
    # Fixed in 3.14.3. aiohttp reaches this project transitively via crewai
    # and langchain dependencies (examples/dev only). See SECURITY.md.
    "aiohttp>=3.14.3",
    # CVE-2026-59884, CVE-2026-59885, CVE-2026-59886: ASN.1 parsing
    # vulnerabilities in pyasn1 — integer overflow in tag decoding, unbounded
    # memory allocation via crafted indefinite-length encodings, and stack
    # exhaustion through deeply nested constructed types — affecting <0.6.4.
    # Fixed in 0.6.4. pyasn1 previously reached this project transitively via
    # cryptography (PyJWT[crypto]) but is no longer in the resolved dependency
    # tree; this constraint is retained defensively. See SECURITY.md.
    "pyasn1>=0.6.4",
    # CVE-2026-54058, CVE-2026-54059, CVE-2026-54060, CVE-2026-55379,
    # CVE-2026-55380, CVE-2026-55798, CVE-2026-59197, CVE-2026-59198,
    # CVE-2026-59199, CVE-2026-59200, CVE-2026-59203, CVE-2026-59204,
    # CVE-2026-59205: heap out-of-bounds reads/writes, decompression-bomb check
    # bypasses, command injection, and DoS in pillow, affecting <12.3.0.
    # Fixed in 12.3.0. pillow reaches this project transitively via
    # llama-index-core and via pdfplumber -> crewai (examples/dev only).
    # See SECURITY.md.
    "pillow>=12.3.0",
    # CVE-2026-12061 (ReDoS in ReviewsCorpusReader), CVE-2026-12072 and
    # CVE-2026-12074 (path traversal in NKJP/FrameNet corpus readers),
    # CVE-2026-12075 (DNS-rebinding SSRF bypass), CVE-2026-54293 and
    # CVE-2026-12243 (URL-encoded path traversal in nltk.data.load): all
    # affecting <=3.9.4. Fixed in 3.10.0. nltk reaches this project
    # transitively via llama-index / llama-index-core (examples only).
    # See SECURITY.md.
    "nltk>=3.10.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["barndoor"]

# Exclude non-package artefacts from all build targets
[tool.hatch.build]
exclude = [
    "examples/**",
    "env.*.example",
]

# Enable editable install
[tool.hatch.metadata]
allow-direct-references = true

# Use uv-dynamic-versioning as version source (reads from VCS tags)
[tool.hatch.version]
source = "uv-dynamic-versioning"

# Package discovery configuration
[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["barndoor*"]
